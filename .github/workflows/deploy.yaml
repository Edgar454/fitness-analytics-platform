name: CI/CD pipeline

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - "terraform/main/**"
              - "lambda/**"
              - "ingestion/**"
            build:
              - "ingestion/**"

  terraform-plan:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-dispatcher
      - uses: ./.github/actions/plan-terraform
        with:
          github_role_arn: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          database_host: ${{ secrets.DATABASE_HOST }}
          db_user: ${{ secrets.DB_USER }}
          database_password: ${{ secrets.DATABASE_PASSWORD }}
          cert_path: ${{ secrets.CERT_PATH }}

  terraform-apply:
    needs: [changes, terraform-plan]
    if: needs.changes.outputs.infra == 'true'
    environment: terraform-apply
    runs-on: ubuntu-latest
    outputs:
      ecr_url: ${{ steps.infra.outputs.ecr_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/apply-terraform
        id: infra
        with:
          github_role_arn: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
  
  build-ingestion-image:
    needs: [changes, terraform-apply]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: eu-west-1
          repository: sportfolio-worker
          dockerfile: ingestion/Dockerfile
          tag: latest